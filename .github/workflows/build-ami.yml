name: Build AMI and deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  LT_ID: lt-REPLACE_ME
  ASG_NAME: myapp-asg

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

    #   - name: Debug OIDC token
    #     run: |
    #       python3 - <<'EOF'
    #       import os, json, base64, urllib.request
    #       url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
    #       req = urllib.request.Request(url, headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
    #       tok = json.load(urllib.request.urlopen(req))['value'].split('.')[1]
    #       tok += '=' * (-len(tok) % 4)
    #       claims = json.loads(base64.urlsafe_b64decode(tok))
    #       print({k: claims.get(k) for k in ('sub', 'aud', 'iss')})
    #       EOF

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::821999471331:role/github-packer-role
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-packer@v3

      - name: Build AMI
        run: |
          packer init packer/
          packer build -var "git_sha=${GITHUB_SHA::7}" packer/

      - name: Get AMI ID
        run: |
          AMI_ID=$(jq -r '.builds[-1].artifact_id' manifest.json | cut -d: -f2)
          echo "AMI_ID=$AMI_ID" >> $GITHUB_ENV
          echo "New AMI: $AMI_ID"

      - name: New Launch Template version
        run: |
          aws ec2 create-launch-template-version \
            --launch-template-id $LT_ID \
            --source-version '$Latest' \
            --launch-template-data "{\"ImageId\":\"$AMI_ID\"}"

      - name: Roll out to Auto Scaling Group
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name $ASG_NAME \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":120}'